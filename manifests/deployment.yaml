# Render with envsubst using manifests/.env; infrastructure owns the SA and SPC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-broker
  namespace: github-broker
  labels:
    app.kubernetes.io/name: github-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-broker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: token-broker
      # Keep default token automount: adapters read this pod's API token and CA.
      nodeSelector:
        kubernetes.azure.com/agentpool: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-broker
          image: ${AZURE_ACR_NAME}.azurecr.io/github-broker:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: GH_APP_ID
              value: "${GH_APP_ID}"
            - name: GH_APP_PRIVATE_KEY_PATH
              value: /mnt/secrets/token-broker-gh-app-private-key
            - name: GH_REPOSITORIES
              value: '${GH_REPOSITORIES}'
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: github-broker-secrets
